<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>金蝶云星空插件开发 Agent · 演示</title>
<style>
:root{
  --pri:#5B5BD6; --pri-2:#4A56E2; --pri-bg:#EEF0FD; --pri-line:#C3C9F7;
  --ok:#16A34A; --ok-bg:#E7F8ED; --ok-line:#A8E5BE;
  --warn:#B45309; --warn-bg:#FFF7EA; --warn-line:#F2DFC0;
  --err:#E1483A; --err-bg:#FCEBEB;
  --t1:#1F2329; --t2:#5F6672; --t3:#9AA0A6;
  --line:#E4E6EB; --line2:#C9CDD4; --bg:#F5F6F8;
  --neon:#6E7BFF; --neon-2:#33E1C6; --ink:#0B1030; --ink-line:#2A3160;
  --r:6px; --r2:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:12px;font-weight:700;color:var(--pri-2);font-size:15px}
.wrap{max-width:1080px;margin:24px auto;padding:0 20px}

/* 输入区 */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:22px 26px;margin-bottom:20px}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px}
.row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;margin-bottom:16px;align-items:start}
.row:last-child{margin-bottom:0}
.lab{font-size:13px;color:var(--t2);text-align:right;padding-top:8px}
.lab i{color:var(--err);font-style:normal;margin-right:2px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font:inherit;font-size:14px;outline:0}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:9px 20px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--line2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-2)}
.btn.ai{background:linear-gradient(120deg,#6E7BFF,#5B5BD6);border:0;color:#fff;box-shadow:0 4px 14px rgba(94,110,255,.32)}
.btn.ai:disabled{opacity:.5;cursor:not-allowed}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.danger:hover{background:#c73b2e}
.btn.danger:disabled{opacity:.5}
.hint{font-size:12px;color:var(--t3);margin-top:6px}
.bar{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;color:var(--t2)}
.msg.err{color:var(--err)}
.hide{display:none!important}

/* 进度区(任务状态 + SSE 连接) */
.stage{background:var(--ink);border-radius:14px;overflow:hidden;border:1px solid var(--ink-line);margin-bottom:20px}
.stghead{padding:16px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ink-line)}
.orb{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6E7BFF,#33E1C6);display:grid;place-items:center;color:#fff;font-size:17px}
.stghead h2{color:#fff;font-size:15px;font-weight:600}
.stghead p{color:#AEB4E0;font-size:12px}
.stghead .taskid{margin-left:auto;color:#5C6398;font-size:12px}
.conn{font-size:11px;padding:3px 10px;border-radius:12px;background:#141A3D;color:#8890C6;border:1px solid var(--ink-line)}
.conn.live{color:#33E1C6;border-color:#1E4D46;background:#0C1F1B}
.conn.reconnect,.conn.retry{color:#F5B34B;border-color:#4D3A1B;background:#201709}
.conn.closed{color:#8890C6}

/* 澄清对话流 */
.chat{border:1px solid var(--line);border-radius:var(--r2);background:#fff;padding:18px 20px;margin-bottom:0}
.thread{display:flex;flex-direction:column;gap:12px;max-height:340px;overflow-y:auto;padding:2px}
.bub{max-width:78%;padding:10px 14px;border-radius:12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.bub.ai{background:var(--pri-bg);border:1px solid var(--pri-line);align-self:flex-start;border-top-left-radius:4px}
.bub.user{background:var(--ok-bg);border:1px solid var(--ok-line);align-self:flex-end;border-top-right-radius:4px}
.bub.sys{background:var(--err-bg);border:1px solid var(--err-line,#F0B9B2);align-self:center;font-size:12px}
.bub .who{display:block;font-size:11px;color:var(--t3);margin-bottom:3px}
.chat-bar{display:flex;gap:10px;margin-top:14px;align-items:center}
.chat-bar input{flex:1}
.sum-pane{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r);padding:12px 16px;font-size:13px;color:var(--t1)}
.sum-h{font-weight:700;margin:6px 0 2px;color:var(--warn)}
.sum-li{margin:2px 0}
.sum-p{margin:2px 0}

/* TodoList 任务矩阵 */
.sub{border:1px solid var(--line);border-radius:var(--r2);background:#fff;padding:13px 16px;margin-bottom:10px}
.sub:last-child{margin-bottom:0}
.sub.failed{border-color:#F0B9B2;background:#FFF8F7}
.sub-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sub-id{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:700;color:var(--pri-2);background:var(--pri-bg);border:1px solid var(--pri-line);border-radius:5px;padding:1px 8px}
.sub-title{font-weight:600;font-size:13.5px;min-width:0}
.sub-title small{color:var(--t3);font-weight:400;margin-left:6px}
.badge{font-size:11px;padding:2px 10px;border-radius:12px;font-weight:600;margin-left:auto}
.badge.pending{background:#F0F1F3;color:#6B7280}
.badge.run{background:var(--pri-bg);color:var(--pri-2)}
.badge.done{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.badge.delivered{background:var(--ok);color:#fff}
.badge.rework{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.badge.blocked{background:#2A2F3D;color:#C9CDD4}
.badge.failed{background:var(--err);color:#fff}
.sub-meta{font-size:11.5px;color:var(--t3);margin-top:6px}
.phases{display:flex;gap:6px;margin-top:9px;align-items:center}
.ph{width:26px;height:6px;border-radius:3px;background:var(--line2);opacity:.45}
.ph.done{background:var(--neon-2);opacity:1}
.ph.cur{background:linear-gradient(90deg,var(--neon),var(--neon-2));opacity:1;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.sub-err{font-size:11.5px;color:var(--err);background:var(--err-bg);border-radius:var(--r);padding:4px 9px;margin-top:8px;word-break:break-all}
.sub-warn{font-size:11.5px;color:var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:4px 9px;margin-top:8px}
.tag.type{font-size:11px;padding:2px 9px;border-radius:12px;font-weight:500;background:#fff;border:1px solid var(--line2);color:var(--t2)}
.cnt{font-size:12px;color:var(--t2);margin-left:8px;font-weight:400}
.cnt b{color:var(--pri-2)}

/* 交付 + 验收 */
.dlv{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin:6px 0;word-break:break-all}
.acc-box{border:1px solid var(--line);border-radius:var(--r2);background:#fff;padding:16px 20px;margin-top:14px}
.acc-box h4{font-size:14px;margin-bottom:10px}
.acc-result{font-size:14px;font-weight:600;padding:12px 16px;border-radius:var(--r2);margin-top:14px}
.acc-result.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.acc-result.no{background:var(--err-bg);border:1px solid #F0B9B2;color:var(--err)}
.acc-result .acc-at{font-size:11px;font-weight:400;margin-left:8px}
.acc-result .acc-reason{margin-top:6px;font-size:13px;font-weight:400}

/* 错误条 */
#errMsg{background:var(--err-bg);border:1px solid #F0B9B2;color:var(--err);border-radius:var(--r2);padding:12px 18px;margin-bottom:20px;font-size:13px}
@media(max-width:760px){.row{grid-template-columns:1fr}.lab{text-align:left}.badge{margin-left:0}}
</style>
</head>
<body>
<div class="top">🔧 金蝶云星空插件开发 Agent · 前端演示</div>
<div class="wrap">

  <!-- ===== 输入区 ===== -->
  <div class="card" id="inputCard">
    <h3>插件需求</h3>
    <div class="row">
      <label class="lab"><i>*</i>需求描述</label>
      <div>
        <textarea id="requirement" placeholder="例如:给采购订单审核增加库存校验,库存不足时禁止提交并提示,触发时机为提交时。"></textarea>
        <p class="hint">描述要开发的插件行为:目标单据(FormId)、触发时机、核心规则。需求越具体,澄清轮次越少。</p>
      </div>
    </div>
    <div class="row">
      <label class="lab">目标环境</label>
      <div>
        <select id="env">
          <option value="test" selected>test(测试环境)</option>
          <option value="prod">prod(生产环境)</option>
        </select>
        <p class="hint">对应金蝶目标环境名(KD_BASE_URL / KD_USERNAME / KD_PASSWORD / KD_DATA_CENTER 环境变量)。</p>
      </div>
    </div>
    <div class="bar">
      <button class="btn ai" id="startBtn">✦ 开始开发</button>
      <span class="msg" id="apiKeyHint">API Key: <input type="text" id="apikey" value="sk-demo-key" style="width:180px;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:4px" /></span>
    </div>
  </div>

  <!-- ===== 任务状态区 ===== -->
  <div class="stage hide" id="stageCard">
    <div class="stghead">
      <div class="orb">🔧</div>
      <div><h2 id="stageTitle">AI 正在启动开发流水线</h2><p id="stageSub">准备需求澄清…</p></div>
      <div class="conn" id="conn">● 未连接</div>
      <div class="taskid" id="taskId">—</div>
    </div>
  </div>

  <!-- ===== 澄清对话流 ===== -->
  <div class="card hide" id="clarifyCard">
    <h3>需求澄清 · <span style="font-weight:400;color:var(--t3)">AI 一次一问,确认后拆解子任务</span></h3>
    <div class="chat">
      <div class="thread" id="thread"></div>
      <div class="chat-bar hide" id="answerBox">
        <input type="text" id="answerInput" placeholder="输入回答,回车发送" />
        <button class="btn pri" id="answerSend">发送</button>
      </div>
      <div class="hide" id="confirmBox">
        <div class="sum-pane" id="sumPane"></div>
        <div class="bar">
          <button class="btn pri" id="confirmAccept">✓ 确认通过,开始开发</button>
          <span class="msg" id="confirmMsg"></span>
        </div>
        <div class="bar">
          <input type="text" id="reviseInput" placeholder="不认可?补充修正意见,AI 会调整后再次确认" />
          <button class="btn" id="reviseSend">提交补充</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== TodoList 任务矩阵 ===== -->
  <div class="card hide" id="matrixCard">
    <h3>TodoList 任务矩阵<span class="cnt">共 <b id="todoCnt">0</b> 个子任务</span></h3>
    <div id="matrix"></div>
  </div>

  <!-- ===== 交付区 ===== -->
  <div class="card hide" id="deliverCard">
    <h3>交付物</h3>
    <div id="deliverList"></div>
    <div class="acc-box" id="acceptBox">
      <h4>验收</h4>
      <div class="bar" style="margin-top:0">
        <button class="btn pri" id="acceptBtn">✓ 验收通过</button>
        <button class="btn danger" id="rejectBtn">✗ 打回修改</button>
        <span class="msg" id="acceptMsg"></span>
      </div>
      <div class="row" style="margin-top:12px;grid-template-columns:1fr">
        <label class="lab" style="text-align:left;padding-top:0">打回原因(打回时必填,原因会沉淀进经验库用于后续修复)</label>
        <input type="text" id="rejectReason" placeholder="例如:需求变更,金额精度需要改为 6 位小数" />
      </div>
    </div>
    <div class="acc-result hide" id="acceptResult"></div>
  </div>

  <div class="msg err hide" id="errMsg"></div>
</div>

<script>
// API 地址动态取当前访问的 host(与 demo.html 同模式,内网其他机器访问指向服务器自身)
const API = window.location.protocol + "//" + window.location.hostname + ":8000";

// 任务运行中状态(每任务一个实例变量)
let taskId = null, finished = false, attempts = 0, answering = false, lastInterruptKey = "";

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function apiHeaders() {
  return { "X-API-Key": ($("#apikey").value || "sk-demo-key").trim() };
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function showError(msg) { $("#errMsg").textContent = msg; $("#errMsg").classList.remove("hide"); }
function hideError() { $("#errMsg").classList.add("hide"); }

/* ===== 子任务阶段定义 ===== */
const PHASES = ["设计", "生成", "审查", "编译", "冒烟", "打包", "交付"];
// status → 当前所处阶段下标(0-based;delivered=7 全完成;failed/blocked 不点亮)
const PHASE_IDX = {
  pending: 0, in_progress: 0,
  design_done: 1, gen_done: 2, review_done: 3, compile_done: 4,
  smoke_done: 5, packaged: 6, delivered: 7,
  needs_rework: 1, blocked: -1, failed: -1,
};
const STATUS_META = {
  pending:      { label: "待执行",   cls: "pending" },
  in_progress:  { label: "执行中",   cls: "run" },
  design_done:  { label: "设计完成", cls: "done" },
  gen_done:     { label: "生成完成", cls: "done" },
  review_done:  { label: "审查通过", cls: "done" },
  compile_done: { label: "编译通过", cls: "done" },
  smoke_done:   { label: "冒烟通过", cls: "done" },
  packaged:     { label: "已打包",   cls: "done" },
  delivered:    { label: "已交付",   cls: "delivered" },
  needs_rework: { label: "返工中",   cls: "rework" },
  blocked:      { label: "阻塞",     cls: "blocked" },
  failed:       { label: "失败",     cls: "failed" },
};
const PLUGIN_META = { bill: "单据插件", service: "服务插件", list: "列表插件" };

function setConn(state) {
  const labels = {
    live: "● 实时连接", reconnect: "● 重连中…", retry: "● 断线重试", closed: "● 已结束",
  };
  const el = $("#conn");
  el.className = "conn " + state;
  el.textContent = labels[state] || state;
}

/* ===== 开始任务 ===== */
$("#startBtn").onclick = async () => {
  const req = $("#requirement").value.trim();
  // 空需求引导:提示 + 示例,不发请求
  if (!req) {
    showError("需求不能为空。请描述要开发的插件行为,例如:「给采购订单审核增加库存校验,库存不足时禁止提交并提示」。");
    return;
  }
  hideError();
  const btn = $("#startBtn");
  btn.disabled = true; btn.textContent = "✦ 启动中…";
  resetUI();
  try {
    const r = await fetch(API + "/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...apiHeaders() },
      body: JSON.stringify({ requirement: req, env: $("#env").value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    taskId = d.task_id;
    $("#taskId").textContent = taskId;
    $("#stageCard").classList.remove("hide");
    $("#stageTitle").textContent = "AI 正在运行开发流水线";
    $("#stageSub").textContent = "已建任务,连接实时进度流…";
    btn.textContent = "✦ 运行中…";
    finished = false; attempts = 0;
    tick();
  } catch (e) {
    showError("启动失败: " + e.message);
    alert("启动失败: " + e.message);
    btn.disabled = false; btn.textContent = "✦ 开始开发";
  }
};

function resetUI() {
  $("#clarifyCard").classList.add("hide");
  $("#matrixCard").classList.add("hide");
  $("#deliverCard").classList.add("hide");
  $("#thread").innerHTML = "";
  $("#answerBox").classList.add("hide");
  $("#confirmBox").classList.add("hide");
  $("#acceptResult").classList.add("hide");
  $("#acceptBox").classList.remove("hide");
  $("#acceptMsg").textContent = "";
  $("#rejectReason").value = "";
  $("#answerInput").value = "";
  $("#reviseInput").value = "";
  $("#matrix").innerHTML = "";
  answering = false; lastInterruptKey = "";
}

/* ===== SSE 主循环:重连 + /state 全量兜底 =====
 * 注:API 的 SSE 端点要求 X-API-Key 头,原生 EventSource 无法携带自定义
 * 头,故用 fetch + ReadableStream 手写 SSE 客户端(行为等价,且支持断线
 * 重连退避);每次(重)连前先拉 /state 全量快照兜底,再开实时流。 */
async function tick() {
  while (!finished) {
    setConn("reconnect");
    try { await fetchState(); } catch (e) { /* 服务未就绪,下一轮再试 */ }
    if (finished) break;
    try { await connectSSE(); } catch (e) { /* 连接失败,退避重试 */ }
    if (finished) break;
    attempts++;
    setConn("retry");
    await sleep(Math.min(15000, 1000 * 2 ** Math.min(attempts, 5)));
  }
}

async function fetchState() {
  const r = await fetch(API + `/tasks/${taskId}/state`, { headers: apiHeaders() });
  if (!r.ok) throw new Error("state HTTP " + r.status);
  const s = await r.json();
  renderSnapshot(s);
  // /state 兜底需能独立走完流程:done → 亮交付/验收;error → 红标 + 终止重连
  if (s.status === "error") {
    finished = true; setConn("closed");
    showError(s.error || "任务失败");
    finishUI(true, s);
  } else if (s.status === "done") {
    finished = true; setConn("closed");
    finishUI(false, s);
  }
  return s;
}

async function connectSSE() {
  const resp = await fetch(API + `/tasks/${taskId}/events`, { headers: apiHeaders() });
  if (!resp.ok) throw new Error("SSE HTTP " + resp.status);
  if (!resp.body) throw new Error("浏览器不支持流式响应");
  setConn("live");
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;                       // 服务端关闭(任务结束或连接断开)
    // 整缓冲归一化(不能按 chunk 单独 replace:\r\n 可能跨 chunk 边界被拆开,
    // 残留 \r 会让帧合并,JSON.parse 失败导致事件静默丢失)
    buf = (buf + dec.decode(value, { stream: true })).replace(/\r\n/g, "\n");
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, i);
      buf = buf.slice(i + 2);
      handleBlock(block);
      attempts = 0;                        // 收到真实帧即视为链路存活,退避计数复位
    }
  }
}

/* ===== SSE 帧解析与分发 ===== */
function handleBlock(block) {
  let name = "message", dataStr = "";
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) name = line.slice(6).trim();
    else if (line.startsWith("data:")) dataStr += line.slice(5).trim() + "\n";
  }
  if (!dataStr.trim()) return;
  dispatch(name, dataStr.trim());
}

function dispatch(name, dataStr) {
  let data;
  try { data = JSON.parse(dataStr); } catch (e) { data = dataStr; }
  if (name === "todo") {
    if (Array.isArray(data) && data.length) renderTodo(data);
  } else if (name === "interrupt") {
    renderInterrupt(data);
  } else if (name === "question" || name === "confirm") {
    // 防御:契约里 interrupt payload 带 type 区分;此处兼容独立事件名
    const p = (data && typeof data === "object") ? data : {};
    renderInterrupt(name === "question"
      ? { type: "question", text: p.text || p.question || dataStr }
      : { type: "confirm", summary: p.summary || dataStr });
  } else if (name === "acceptance") {
    showAcceptance(data);
  } else if (name === "done") {
    finished = true; setConn("closed");
    renderSnapshot(data);
    finishUI(false, data);
  } else if (name === "error") {
    finished = true; setConn("closed");
    renderSnapshot(data);
    showError((data && data.error) || "任务执行失败");
    finishUI(true, data);
  }
}

function renderSnapshot(s) {
  if (!s || typeof s !== "object") return;
  if (s.status === "waiting" && s.interrupt) renderInterrupt(s.interrupt);
  if (Array.isArray(s.todo)) renderTodo(s.todo);
  if (Array.isArray(s.final_deliverables) && s.final_deliverables.length) renderDeliverables(s.final_deliverables);
  if (s.acceptance) showAcceptance(s.acceptance);
}

function finishUI(isError, snap) {
  $("#stageTitle").textContent = isError ? "任务失败" : "任务完成";
  $("#stageSub").textContent = isError ? (snap && snap.error) || "图执行失败"
    : "全部子任务已交付,请在下方验收";
  $("#answerBox").classList.add("hide");
  $("#confirmBox").classList.add("hide");
  renderTodo(snap && snap.todo);
  renderDeliverables(snap && snap.final_deliverables);
  showAcceptance(snap && snap.acceptance);
  $("#deliverCard").classList.remove("hide");
  const btn = $("#startBtn");
  btn.disabled = false; btn.textContent = "✦ 开始新任务";
}

/* ===== 澄清对话流 ===== */
function addBubble(who, html) {
  const t = document.createElement("div");
  t.className = "bub " + who;
  const label = { ai: "AI", user: "你", sys: "系统" }[who] || "";
  t.innerHTML = (label ? `<span class="who">${label}</span>` : "") + html;
  const thread = $("#thread");
  thread.appendChild(t);
  thread.scrollTop = thread.scrollHeight;
}

function renderInterrupt(p) {
  if (!p || typeof p !== "object") return;
  const type = p.type || "";
  const key = type + "|" + (type === "confirm" ? (p.summary || "") : (p.text || p.question || ""));
  if (!key || key === lastInterruptKey) return;   // 去重:重连重放 / /state 兜底
  lastInterruptKey = key;
  answering = false;                       // 新提示到来即解锁交互(防 submit 状态残留)
  $("#clarifyCard").classList.remove("hide");
  if (type === "confirm") {
    $("#stageSub").textContent = "请确认需求摘要(不认可可补充修正意见)";
    addBubble("ai", "需求已澄清完毕,以下是确认摘要。认可后我会拆解子任务开始开发:");
    $("#sumPane").innerHTML = renderSummary(p.summary || "");
    $("#answerBox").classList.add("hide");
    $("#confirmBox").classList.remove("hide");
    $("#confirmMsg").textContent = "";
    $("#reviseInput").value = "";
  } else {
    $("#stageSub").textContent = "AI 正在澄清需求…";
    addBubble("ai", escapeHtml(p.text || p.question || JSON.stringify(p)));
    $("#confirmBox").classList.add("hide");
    $("#answerBox").classList.remove("hide");
    $("#answerInput").value = "";
    $("#answerInput").disabled = false;
    $("#answerSend").disabled = false;
    $("#answerInput").focus();
  }
}

function renderSummary(txt) {
  return String(txt || "").split("\n").map(line => {
    const t = escapeHtml(line);
    if (/^#{2,3}\s+/.test(line)) return `<div class="sum-h">${t.replace(/^#+\s+/, "")}</div>`;
    if (/^-\s+/.test(line)) return `<div class="sum-li">• ${t.replace(/^-\s+/, "")}</div>`;
    if (!line.trim()) return "";
    return `<div class="sum-p">${t}</div>`;
  }).join("");
}

/* 提交澄清回答 / 确认(与 C11 CLI 同语义:interrupt resume) */
async function submitAnswer(text) {
  const v = String(text || "").trim();
  if (!v || answering) return;
  answering = true;
  addBubble("user", escapeHtml(v));
  const input = $("#answerInput"), send = $("#answerSend");
  input.disabled = true; send.disabled = true;
  $("#confirmBox").classList.add("hide");
  try {
    const r = await fetch(API + `/tasks/${taskId}/answers`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...apiHeaders() },
      body: JSON.stringify({ answer: v }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    answering = false;                     // 成功后必须复位,否则后续交互全部静默失效
    $("#stageSub").textContent = "已提交,AI 继续处理…";
  } catch (e) {
    answering = false;
    input.disabled = false; send.disabled = false;
    if (v === "确认") { $("#confirmBox").classList.remove("hide"); $("#confirmMsg").textContent = "⚠ " + e.message; $("#confirmMsg").classList.add("err"); }
    else addBubble("sys", "⚠ 提交失败: " + escapeHtml(e.message));
  }
}

$("#answerSend").onclick = () => submitAnswer($("#answerInput").value);
$("#answerInput").addEventListener("keydown", e => { if (e.key === "Enter") submitAnswer($("#answerInput").value); });
$("#confirmAccept").onclick = () => submitAnswer("确认");   // 确认词:is_confirmed 白名单
$("#reviseSend").onclick = () => submitAnswer($("#reviseInput").value);
$("#reviseInput").addEventListener("keydown", e => { if (e.key === "Enter") submitAnswer($("#reviseInput").value); });

/* ===== TodoList 任务矩阵 ===== */
function renderTodo(list) {
  if (!Array.isArray(list) || !list.length) return;   // 澄清期 todo 为空,不亮矩阵
  $("#matrixCard").classList.remove("hide");
  $("#todoCnt").textContent = list.length;
  $("#matrix").innerHTML = list.map(cardHTML).join("");
}

function cardHTML(s) {
  s = s || {};
  const st = s.status || "pending";
  const meta = STATUS_META[st] || { label: st, cls: "pending" };
  const cur = PHASE_IDX[st] != null ? PHASE_IDX[st] : 0;
  const dots = PHASES.map((p, i) => {
    let cls = "off";
    if (st !== "failed" && st !== "blocked") cls = i < cur ? "done" : (i === cur ? "cur" : "off");
    return `<i class="ph ${cls}" title="${p}"></i>`;
  }).join("");
  const deps = (s.deps && s.deps.length) ? escapeHtml(s.deps.join(" · ")) : "—";
  const type = PLUGIN_META[s.plugin_type] || escapeHtml(s.plugin_type || "");
  const errs = Array.isArray(s.compile_errors) ? s.compile_errors : [];
  let errHtml = "";
  if (errs.length) {
    const first = errs[0] || {};
    errHtml = `<div class="sub-err">⚠ 编译错误 ×${errs.length}: ${escapeHtml(first.message || first.code || JSON.stringify(first)).slice(0, 140)}</div>`;
  }
  const rvHtml = s.review_verdict === "Needs fixes" ? `<div class="sub-warn">⚠ 审查未通过(退回重新生成)</div>` : "";
  return `<div class="sub${st === "failed" ? " failed" : ""}">
    <div class="sub-top">
      <span class="sub-id">${escapeHtml(s.id || "?")}</span>
      <span class="tag type">${type}</span>
      <span class="sub-title">${escapeHtml(s.title || "")}</span>
      <span class="badge ${meta.cls}">${meta.label}</span>
    </div>
    <div class="sub-meta">依赖: ${deps} · 代码产物: ${s.code_path ? "已生成" : "—"}</div>
    <div class="phases">${dots}<span style="font-size:11px;color:var(--t3);margin-left:2px">${PHASES.join("→")}</span></div>
    ${rvHtml}${errHtml}
  </div>`;
}

/* ===== 交付物 + 验收 ===== */
function renderDeliverables(paths) {
  const list = Array.isArray(paths) ? paths : [];
  $("#deliverList").innerHTML = list.length
    ? list.map(p => `<div class="dlv">${escapeHtml(p)}</div>`).join("")
    : `<div class="msg" style="color:var(--t3)">(无交付包)</div>`;
}

function showAcceptance(v) {
  if (!v || typeof v !== "object") return;
  $("#acceptBox").classList.add("hide");
  const box = $("#acceptResult");
  box.classList.remove("hide");
  box.className = "acc-result " + (v.accepted ? "ok" : "no");
  let html = (v.accepted ? "✅ 已验收通过" : "✗ 已打回") + `<span class="acc-at">${escapeHtml(v.at || "")}</span>`;
  if (!v.accepted && v.reason) html += `<div class="acc-reason">打回原因: ${escapeHtml(v.reason)}</div>`;
  box.innerHTML = html;
}

async function submitAcceptance(accepted) {
  const reason = $("#rejectReason").value.trim();
  const msg = $("#acceptMsg");
  if (!accepted && !reason) {
    msg.textContent = "打回需填写原因(原因会沉淀进经验库)";
    msg.classList.add("err");
    return;
  }
  $("#acceptBtn").disabled = true; $("#rejectBtn").disabled = true;
  msg.textContent = "提交中…"; msg.classList.remove("err");
  try {
    const r = await fetch(API + `/tasks/${taskId}/acceptance`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...apiHeaders() },
      body: JSON.stringify({ accepted, reason }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    showAcceptance(d.acceptance);
    msg.textContent = "";
  } catch (e) {
    $("#acceptBtn").disabled = false; $("#rejectBtn").disabled = false;
    msg.textContent = "⚠ " + e.message;
    msg.classList.add("err");
  }
}

$("#acceptBtn").onclick = () => submitAcceptance(true);
$("#rejectBtn").onclick = () => submitAcceptance(false);
</script>
</body>
</html>
