# admin_console 管理控制台 nginx 路由片段(注入 sentiment nginx 容器的 conf.d)。
# 最长前缀匹配优先于现有 location /api/(sentiment 反代):
#   - /api/v1/admin/ → admin 容器(超管接口,body 传 key)
#   - /admin          → admin 容器根(serve web/admin.html)
# admin 容器服务名 = admin,网络 = deploy_default(与 deploy-nginx-1 同网)。
location /api/v1/admin/ {
    proxy_pass http://admin:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}

location = /admin {
    # 301 到 /admin/(避免 /admin 无尾斜杠时 FileResponse 相对路径错乱)
    return 301 /admin/;
}

location /admin/ {
    # 去掉 /admin 前缀,转发到 admin 容器根(/admin/foo → /foo)
    proxy_pass http://admin:8003/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
