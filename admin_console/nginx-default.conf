# admin_console 部署用合并版 nginx default.conf。
# = sentiment 现有 default.conf + admin 两条 location(最长前缀优先于 /api/)。
# 部署时 docker cp 覆盖 deploy-nginx-1 的 /etc/nginx/conf.d/default.conf 并 reload,
# 不污染 sentiment git 目录(运行时覆盖,非改文件)。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index demo.html;

    location = / {
        try_files /demo.html =404;
    }

    # === admin_console 管理控制台(最长前缀优先,先于 /api/ 匹配)===
    # /api/v1/admin/ → admin 容器(超管接口,body 传 key)
    location /api/v1/admin/ {
        proxy_pass http://admin:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # /admin 无尾斜杠 → 301 到 /admin/
    location = /admin {
        return 301 /admin/;
    }

    # /admin/ 去掉前缀转发到 admin 容器根(/admin/foo → /foo,serve admin.html)
    location /admin/ {
        proxy_pass http://admin:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # === admin_console 结束 ===

    # 同源反代(备用;当前前端直连 :8000)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }
}
