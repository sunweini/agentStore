# sentiment-query-agent 演示页静态托管(80 端口)。
# demo.html 的 API 常量自动拼 hostname:8000,直连 api 容器;/api/ 同源反代备用。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index demo.html;

    location = / {
        try_files /demo.html =404;
    }

    # 同源反代(备用;当前前端直连 :8000)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }
}
