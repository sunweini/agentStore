# sentiment-query-agent 演示页静态托管(80 端口)。
# demo.html 的 API 常量自动拼 hostname:8000,直连 api 容器;/api/ 同源反代备用。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index demo.html;

    location = / {
        try_files /demo.html =404;
    }

    # === admin_console 管理控制台路由(最长前缀优先,先于 /api/ 匹配)===
    # admin 容器(compose 项目 deploy-admin,服务名 admin)在 deploy_default 网络
    location /api/v1/admin/ {
        proxy_pass http://admin:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://admin:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # === admin_console 结束 ===

    # 同源反代(备用;当前前端直连 :8000)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }
}
